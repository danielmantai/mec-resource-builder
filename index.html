    results.push(['Download SCORM ZIP',fileBase+' - SCORM.zip',zip({'imsmanifest.xml':manifest,'index.html':html})],['Editable HTML',fileBase+'.html',new Blob([html],{type:'text/html'})]);
  }else if(data.kind==='notes'){
    results.push(['Download lesson HTML',fileBase+'.html',new Blob([notes(data)],{type:'text/html'})]);
  }else{results.push(['Download quiz ZIP',fileBase+' - quiz.zip',makeQuiz(data)]);}
  results.push(['Editable JSON',fileBase+'.json',new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'})]);
  return results;
}

const replyBox = document.getElementById('reply');
const fileInput = document.getElementById('file');
const downloadList = document.getElementById('downloads');
const resultPanel = document.getElementById('result');
const errorMessage = document.getElementById('error');
const steps = {
  exercise: 'Add the SCORM ZIP in Brightspace Content using Add Existing, then SCORM/xAPI Object. Choose no grade item and open it in a new tab.',
  quiz: 'In Brightspace Course Admin, open Import / Export / Copy Components and import the quiz ZIP. Preview the hidden quiz before releasing it.',
  notes: 'Upload the lesson HTML to your Brightspace content unit. Open it to check the examples, self-checks and Expand control.'
};

function resetDownloads() {
  for (const link of downloadList.querySelectorAll('a')) URL.revokeObjectURL(link.href);
  downloadList.replaceChildren();
  resultPanel.hidden = true;
  errorMessage.textContent = '';
}

function unpackReply(text) {
  try {
    return JSON.parse(text.trim());
  } catch {
    const blocks = [...text.matchAll(/\x60\x60\x60(?:json)?\s*([\s\S]*?)\x60\x60\x60/gi)];
    if (blocks.length === 1) {
      try { return JSON.parse(blocks[0][1]); } catch { /* Use the same recovery message below. */ }
    }
    throw new Error('Paste the complete JSON code block from the workshop agent, or open a saved JSON file.');
  }
}

function buildFiles() {
  resetDownloads();
  try {
    const data = unpackReply(replyBox.value);
    const files = buildResource(data);
    for (const [label, filename, contents] of files) {
      const link = document.createElement('a');
      link.textContent = label;
      link.className = downloadList.childElementCount ? 'download secondary' : 'download';
      link.href = URL.createObjectURL(contents);
      link.download = filename;
      downloadList.append(link);
    }
    const title = document.getElementById('resource-title');
    title.textContent = data.title;
    document.getElementById('instructions').textContent = steps[data.kind];
    resultPanel.hidden = false;
    title.focus();
  } catch (error) {
    resetDownloads();
    errorMessage.textContent = error.message;
  }
}

replyBox.addEventListener('input', resetDownloads);
document.getElementById('build').addEventListener('click', buildFiles);
document.getElementById('open').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  try {
    replyBox.value = await file.text();
    buildFiles();
  } catch {
    resetDownloads();
    errorMessage.textContent = 'This file could not be read. Try opening it again.';
  } finally {
    fileInput.value = '';
  }
});
</script>
